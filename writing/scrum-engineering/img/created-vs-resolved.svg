  <text class="t small muted" x="588" y="376" text-anchor="middle">Month 6</text>
  <polyline class="line a" points="96,106.72 194.4,115.84 292.8,95.78 391.2,130.43 489.6,111.58 588,122.53"/>
  <polyline class="line b dash" points="96,109.15 194.4,113.41 292.8,98.21 391.2,127.39 489.6,114.02 588,120.7"/>
