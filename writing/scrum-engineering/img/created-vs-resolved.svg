<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="cvr-t cvr-d">
  <title id="cvr-t">Created vs resolved — six months (illustrative)</title>
  <desc id="cvr-d">Line chart. issues / month over 6 periods. Created runs 410, 395, 428, 371, 402, 384; resolved runs 406, 399, 424, 376, 398, 387. Totals are 2,390 created and 2,390 resolved, a net change of 0. The two lines track each other for the whole period: arrival rate equals service rate, so utilisation sits at 1.00 and the standing backlog neither grows nor drains. Illustrative figures, not measured data.</desc>
  <style>
    .surface { fill: #fbfaf8; }
    .grid    { stroke: #e0ddd2; stroke-width: 1; fill: none; }
    .axis    { stroke: #5d5a4f; stroke-width: 1; fill: none; }
    .ink     { fill: #16150f; }
    .muted   { fill: #5d5a4f; }
    .a       { stroke: #8a4b1e; }
    .af      { fill: #8a4b1e; }
    .b       { stroke: #1a5fb4; }
    .bf      { fill: #1a5fb4; }
    .ring    { stroke: #fbfaf8; stroke-width: 2; }
    .line    { fill: none; stroke-width: 2; stroke-linejoin: round;
               stroke-linecap: round; }
    .dash    { stroke-dasharray: 7 5; }
    .t       { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .title   { font-size: 14px; font-weight: 600; }
    .lab     { font-size: 12px; }
    .note    { font-size: 12px; }
    .small   { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #131310; }
      .grid    { stroke: #2e2d26; }
      .axis    { stroke: #9d998b; }
      .ink     { fill: #eceae1; }
      .muted   { fill: #9d998b; }
      .a       { stroke: #c87d3c; }
      .af      { fill: #c87d3c; }
      .b       { stroke: #4a86d8; }
      .bf      { fill: #4a86d8; }
      .ring    { stroke: #131310; }
    }
  </style>
  <rect class="surface" width="720" height="400"/>
  <text class="t title ink" x="24" y="28">Created vs resolved — six months (illustrative)</text>
  <text class="t small muted" x="24" y="46">issues / month</text>
  <line class="line a" x1="430" y1="20" x2="458" y2="20"/>
  <circle class="ring" cx="444" cy="20" r="4"/><circle class="af" cx="444" cy="20" r="4"/>
  <text class="t lab muted" x="464" y="24">created</text>
  <line class="line b dash" x1="536.4" y1="20" x2="564.4" y2="20"/>
  <rect class="ring" x="546.9" y="16.5" width="7" height="7"/><rect class="bf" x="546.9" y="16.5" width="7" height="7"/>
  <text class="t lab muted" x="570.4" y="24">resolved</text>
  <line class="grid" x1="56" y1="295.2" x2="628" y2="295.2"/>
  <line class="grid" x1="56" y1="234.4" x2="628" y2="234.4"/>
  <line class="grid" x1="56" y1="173.6" x2="628" y2="173.6"/>
  <line class="grid" x1="56" y1="112.8" x2="628" y2="112.8"/>
  <line class="grid" x1="56" y1="52" x2="628" y2="52"/>
