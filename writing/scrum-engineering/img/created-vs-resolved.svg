  <circle class="ring" cx="489.6" cy="111.58" r="4"/><circle class="af" cx="489.6" cy="111.58" r="4"/>
  <circle class="ring" cx="588" cy="122.53" r="4"/><circle class="af" cx="588" cy="122.53" r="4"/>
  <rect class="ring" x="92.5" y="105.65" width="7" height="7"/><rect class="bf" x="92.5" y="105.65" width="7" height="7"/>
  <rect class="ring" x="190.9" y="109.91" width="7" height="7"/><rect class="bf" x="190.9" y="109.91" width="7" height="7"/>
  <rect class="ring" x="289.3" y="94.71" width="7" height="7"/><rect class="bf" x="289.3" y="94.71" width="7" height="7"/>
  <rect class="ring" x="387.7" y="123.89" width="7" height="7"/><rect class="bf" x="387.7" y="123.89" width="7" height="7"/>
  <rect class="ring" x="486.1" y="110.52" width="7" height="7"/><rect class="bf" x="486.1" y="110.52" width="7" height="7"/>
  <rect class="ring" x="584.5" y="117.2" width="7" height="7"/><rect class="bf" x="584.5" y="117.2" width="7" height="7"/>
  <line class="grid" x1="594" y1="120.7" x2="602" y2="107.7"/>
  <text class="t small bf" x="606" y="111.7">387 resolved</text>
  <line class="grid" x1="594" y1="122.53" x2="602" y2="135.53"/>
  <text class="t small af" x="606" y="139.53">384 created</text>
  <text class="t note ink" x="96" y="248">2,390 created · 2,390 resolved · net 0</text>
  <text class="t small muted" x="96" y="268">6 periods. Arrival rate equals service rate:</text>
  <text class="t small muted" x="96" y="286">ρ = 1.00, and the standing backlog never moves.</text>
